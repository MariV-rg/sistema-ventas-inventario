{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas - Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header class="bg-gray-800 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 flex items-center justify-center gap-4">
            <h1 class="text-2xl md:text-3xl font-semibold tracking-wide">
                Sistema de Gestión de Ventas e Inventario
            </h1>
            <div class="bg-white/10 rounded-xl p-1.5 shadow-inner">
                <img src="{% static 'inventario/img/icono.png' %}" alt="Icono inventario" class="w-10 h-10 md:w-12 md:h-12 rounded-lg">
            </div>
        </div>
    </header>

    <    <main class="flex items-center justify-center min-h-[70vh] px-4 py-8 bg-gray-50">
        <div class="bg-white rounded-xl shadow-lg p-8 max-w-2xl w-full text-center transition-all hover:shadow-xl">
            <p class="text-lg md:text-xl text-gray-700 font-light leading-relaxed">
                Bienvenido, <span class="font-medium">{{ user.username }}</span>. <br class="sm:hidden">
                <span class="font-medium text-gray-800">Próximamente:</span> productos, ventas y reportes.
            </p>
             <div class="mt-4 w-16 h-1 bg-indigo-200 mx-auto rounded-full"></div>
            {% if user.is_superuser %}
                <a href="{% url 'registrar_usuario' %}" class="block text-sm text-indigo-600 hover:underline mt-4">
                    Registrar usuario
                </a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" class="mt-6">
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-300 text-center py-4 text-sm border-t border-gray-700">
        <div class="container mx-auto px-4">
            <p class="tracking-wide">Proyecto ADSO - SENA</p>
        </div>
    </footer>

</body>
</html>
